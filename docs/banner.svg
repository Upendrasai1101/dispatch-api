<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="Dispatch Load Balancer: orders assigned to vehicles by priority, capacity and distance">
  <style>
    .title { font: 800 92px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff; letter-spacing: 2px; }
    .sub { font: 600 32px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #f2b134; letter-spacing: 3px; }
    .muted { font: 400 20px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #aab7c4; }
    .vid { font: 700 20px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e8eef3; }
    .load { font: 700 16px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1b2430; }
    .emoji { font: 22px 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif; }
    .stat { font: 700 26px 'Segoe UI', Helvetica, Arial, sans-serif; }
    .statl { font: 600 13px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #aab7c4; letter-spacing: 1.5px; }
    .pill { font: 700 19px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1b2430; }
    .flow { stroke-dasharray: 10 14; animation: dash 1.2s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -24; } }
  </style>

  <rect x="6" y="6" width="1268" height="408" rx="30" fill="#1b2430" stroke="#8a6a3a" stroke-width="12"/>

  <text x="70" y="140" class="title">DISPATCH</text>
  <text x="74" y="186" class="sub">LOAD BALANCER</text>
  <text x="74" y="222" class="muted">Priority first · nearest van · never overloaded</text>

  <rect x="70" y="250" width="430" height="80" rx="12" fill="none" stroke="#5c6b7a" stroke-width="2"/>
  <text x="135" y="290" class="stat" fill="#ff6b6b" text-anchor="middle">12/12</text>
  <text x="135" y="314" class="statl" text-anchor="middle">HIGH ASSIGNED</text>
  <text x="285" y="290" class="stat" fill="#4ec27a" text-anchor="middle">0</text>
  <text x="285" y="314" class="statl" text-anchor="middle">OVERLOADED</text>
  <text x="430" y="290" class="stat" fill="#f2b134" text-anchor="middle">98 ms</text>
  <text x="430" y="314" class="statl" text-anchor="middle">10K ORDERS</text>

  <rect x="70" y="346" width="430" height="44" rx="10" fill="#f2b134"/>
  <text x="285" y="375" class="pill" text-anchor="middle">📦 Haversine · Greedy · Spring Boot</text>

  <path d="M 500 318 C 580 318, 580 85, 660 85" fill="none" stroke="#f2b134" stroke-width="4" class="flow">
    <animate attributeName="d" values="M 500 318 C 580 318, 580 85, 660 85;M 500 318 C 580 318, 580 151, 660 151;M 500 318 C 580 318, 580 217, 660 217;M 500 318 C 580 318, 580 283, 660 283;M 500 318 C 580 318, 580 349, 660 349" calcMode="discrete" dur="10s" repeatCount="indefinite"/>
  </path>

  <g>
    <rect x="660" y="58" width="560" height="54" rx="10" fill="#22313f"/>
    <text x="684" y="93" class="emoji">🚚</text>
    <text x="724" y="92" class="vid">VEH001</text>
    <rect x="842" y="78" width="250" height="14" rx="7" fill="#15202b"/>
    <rect x="842" y="78" width="250.0" height="14" rx="7" fill="#f2b134">
      <animate attributeName="width" values="0;0;250.0;250.0" keyTimes="0;0.02;0.16;1" dur="10s" repeatCount="indefinite"/>
    </rect>
    <rect x="1110" y="70" width="94" height="30" rx="6" fill="#f2b134"/>
    <text x="1157" y="91" class="load" text-anchor="middle">100/100</text>
  </g>
  <g>
    <rect x="660" y="124" width="560" height="54" rx="10" fill="#22313f"/>
    <text x="684" y="159" class="emoji">🚚</text>
    <text x="724" y="158" class="vid">VEH002</text>
    <rect x="842" y="144" width="250" height="14" rx="7" fill="#15202b"/>
    <rect x="842" y="144" width="250.0" height="14" rx="7" fill="#f2b134">
      <animate attributeName="width" values="0;0;250.0;250.0" keyTimes="0;0.06;0.2;1" dur="10s" repeatCount="indefinite"/>
    </rect>
    <rect x="1110" y="136" width="94" height="30" rx="6" fill="#f2b134"/>
    <text x="1157" y="157" class="load" text-anchor="middle">80/80</text>
  </g>
  <g>
    <rect x="660" y="190" width="560" height="54" rx="10" fill="#22313f"/>
    <text x="684" y="225" class="emoji">🚚</text>
    <text x="724" y="224" class="vid">VEH003</text>
    <rect x="842" y="210" width="250" height="14" rx="7" fill="#15202b"/>
    <rect x="842" y="210" width="239.6" height="14" rx="7" fill="#4ec27a">
      <animate attributeName="width" values="0;0;239.6;239.6" keyTimes="0;0.1;0.24;1" dur="10s" repeatCount="indefinite"/>
    </rect>
    <rect x="1110" y="202" width="94" height="30" rx="6" fill="#e8eef3"/>
    <text x="1157" y="223" class="load" text-anchor="middle">115/120</text>
  </g>
  <g>
    <rect x="660" y="256" width="560" height="54" rx="10" fill="#22313f"/>
    <text x="684" y="291" class="emoji">🚚</text>
    <text x="724" y="290" class="vid">VEH004</text>
    <rect x="842" y="276" width="250" height="14" rx="7" fill="#15202b"/>
    <rect x="842" y="276" width="250.0" height="14" rx="7" fill="#f2b134">
      <animate attributeName="width" values="0;0;250.0;250.0" keyTimes="0;0.14;0.28;1" dur="10s" repeatCount="indefinite"/>
    </rect>
    <rect x="1110" y="268" width="94" height="30" rx="6" fill="#f2b134"/>
    <text x="1157" y="289" class="load" text-anchor="middle">90/90</text>
  </g>
  <g>
    <rect x="660" y="322" width="560" height="54" rx="10" fill="#22313f"/>
    <text x="684" y="357" class="emoji">🚚</text>
    <text x="724" y="356" class="vid">VEH005</text>
    <rect x="842" y="342" width="250" height="14" rx="7" fill="#15202b"/>
    <rect x="842" y="342" width="238.6" height="14" rx="7" fill="#4ec27a">
      <animate attributeName="width" values="0;0;238.6;238.6" keyTimes="0;0.18;0.32;1" dur="10s" repeatCount="indefinite"/>
    </rect>
    <rect x="1110" y="334" width="94" height="30" rx="6" fill="#e8eef3"/>
    <text x="1157" y="355" class="load" text-anchor="middle">105/110</text>
  </g>

  <rect x="660" y="58" width="560" height="54" rx="10" fill="none" stroke="#f2b134" stroke-width="3">
    <animate attributeName="y" values="58;124;190;256;322" calcMode="discrete" dur="10s" repeatCount="indefinite"/>
  </rect>
</svg>
