<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-label="Dispatch API: orders flow to the nearest vehicle with room, HIGH priority first">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef6ff"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="440" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="438" rx="23" fill="none" stroke="#dbe4f0" stroke-width="2"/>

  <text x="60" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="96" font-weight="800" fill="url(#title)">DISPATCH</text>
  <text x="60" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#f59e0b">API</text>
  <text x="60" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#475569">Priority first · nearest van · never overloaded</text>

  <rect x="60" y="285" width="190" height="90" rx="14" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
  <text x="155" y="330" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" fill="#16a34a">10/10</text>
  <text x="155" y="358" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#64748b">HIGH ASSIGNED</text>

  <rect x="265" y="285" width="190" height="90" rx="14" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
  <text x="360" y="330" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" fill="#16a34a">0</text>
  <text x="360" y="358" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#64748b">OVERLOADED</text>

  <rect x="470" y="285" width="190" height="90" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="565" y="330" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" fill="#2563eb">510 kg</text>
  <text x="565" y="358" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#64748b">TOTAL DEMAND</text>

  <rect x="60" y="390" width="400" height="40" rx="20" fill="#f59e0b"/>
  <text x="260" y="416" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Haversine · Greedy · Spring Boot</text>

  <!-- dashed route lines: stats card to each vehicle -->
  <g fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 6" opacity="0.8">
    <path d="M660 330 C 680 330, 680 78, 700 78"><animate attributeName="stroke-dashoffset" values="24;0" dur="1s" repeatCount="indefinite"/></path>
    <path d="M660 330 C 680 330, 680 144, 700 144"><animate attributeName="stroke-dashoffset" values="24;0" dur="1s" repeatCount="indefinite"/></path>
    <path d="M660 330 C 680 330, 680 210, 700 210"><animate attributeName="stroke-dashoffset" values="24;0" dur="1s" repeatCount="indefinite"/></path>
    <path d="M660 330 C 680 330, 680 276, 700 276"><animate attributeName="stroke-dashoffset" values="24;0" dur="1s" repeatCount="indefinite"/></path>
    <path d="M660 330 C 680 330, 680 342, 700 342"><animate attributeName="stroke-dashoffset" values="24;0" dur="1s" repeatCount="indefinite"/></path>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="700" y="50" width="440" height="56" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="724" y="84" font-size="18" font-weight="700" fill="#1e293b">VEH001</text>
    <rect x="860" y="72" width="180" height="12" rx="6" fill="#e2e8f0"/>
    <rect x="860" y="72" width="0" height="12" rx="6" fill="#f59e0b">
      <animate attributeName="width" from="0" to="178" dur="1.2s" begin="0.2s" fill="freeze"/>
    </rect>
    <rect x="1060" y="64" width="62" height="28" rx="14" fill="#fef3c7"/>
    <text x="1091" y="83" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">99/100</text>

    <rect x="700" y="116" width="440" height="56" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="724" y="150" font-size="18" font-weight="700" fill="#1e293b">VEH002</text>
    <rect x="860" y="138" width="180" height="12" rx="6" fill="#e2e8f0"/>
    <rect x="860" y="138" width="0" height="12" rx="6" fill="#f59e0b">
      <animate attributeName="width" from="0" to="178" dur="1.2s" begin="0.4s" fill="freeze"/>
    </rect>
    <rect x="1060" y="130" width="62" height="28" rx="14" fill="#fef3c7"/>
    <text x="1091" y="149" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">79/80</text>

    <rect x="700" y="182" width="440" height="56" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="724" y="216" font-size="18" font-weight="700" fill="#1e293b">VEH003</text>
    <rect x="860" y="204" width="180" height="12" rx="6" fill="#e2e8f0"/>
    <rect x="860" y="204" width="0" height="12" rx="6" fill="#2563eb">
      <animate attributeName="width" from="0" to="180" dur="1.2s" begin="0.6s" fill="freeze"/>
    </rect>
    <rect x="1060" y="196" width="62" height="28" rx="14" fill="#dbeafe"/>
    <text x="1091" y="215" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">120/120</text>

    <rect x="700" y="248" width="440" height="56" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="724" y="282" font-size="18" font-weight="700" fill="#1e293b">VEH004</text>
    <rect x="860" y="270" width="180" height="12" rx="6" fill="#e2e8f0"/>
    <rect x="860" y="270" width="0" height="12" rx="6" fill="#22c55e">
      <animate attributeName="width" from="0" to="176" dur="1.2s" begin="0.8s" fill="freeze"/>
    </rect>
    <rect x="1060" y="262" width="62" height="28" rx="14" fill="#dcfce7"/>
    <text x="1091" y="281" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">88/90</text>

    <rect x="700" y="314" width="440" height="56" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="724" y="348" font-size="18" font-weight="700" fill="#1e293b">VEH005</text>
    <rect x="860" y="336" width="180" height="12" rx="6" fill="#e2e8f0"/>
    <rect x="860" y="336" width="0" height="12" rx="6" fill="#2563eb">
      <animate attributeName="width" from="0" to="180" dur="1.2s" begin="1.0s" fill="freeze"/>
    </rect>
    <rect x="1060" y="328" width="62" height="28" rx="14" fill="#dbeafe"/>
    <text x="1091" y="347" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">110/110</text>
  </g>
</svg>
