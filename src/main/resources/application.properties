spring.application.name=dispatch-load-balancer
server.port=${PORT:8080}

# ---------- Default profile: in-memory H2 (local run + tests) ----------
spring.datasource.url=jdbc:h2:mem:dispatchdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# ---------- Bulk performance: JDBC batching ----------
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ---------- Swagger / OpenAPI ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ---------- Error responses: never leak stack traces ----------
server.error.include-stacktrace=never
server.error.include-message=never
